name: CI Pipeline - Boutique de Téléphones

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:  # Permet d'exécuter manuellement

jobs:
  test:
    name: Tests et Validation
    runs-on: ubuntu-latest
    
    # Services nécessaires
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: boutique_telephone_test
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
    
    steps:
      # 1. Checkout du code
      - name: 📥 Checkout du code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      # 2. Installation de Python
      - name: 🐍 Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      # 3. Installation des dépendances
      - name: 📦 Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || echo "No requirements.txt found"
          pip install pytest pytest-cov pytest-html mysql-connector-python
          pip install flake8 black pylint
      
      # 4. Vérification du code avec flake8
      - name: 🔍 Linting avec flake8
        run: |
          flake8 app.py test_app.py --count --select=E9,F63,F7,F82 --show-source --statistics || true
          flake8 app.py test_app.py --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics || true
          black --check app.py test_app.py || true
        continue-on-error: true
      
      # 6. Installation de MySQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client
          exit 1
      
          echo "❌ MySQL n'est pas disponible"
      # 8. Configuration de la base de données
      - name: 🗄️ Configuration de la base de données
        env:
          DB_NAME: boutique_telephone_test
      
      # 9. Exécution des tests avec pytest
      - name: 🧪 Exécution des tests
          DB_USER: root
          DB_PASSWORD: rootpassword
          DB_HOST: 127.0.0.1
          DB_NAME: boutique_telephone_test
        run: |
      
      # 10. Tests avec couverture de code
      - name: 📊 Tests avec couverture
        env:
          DB_USER: root
          DB_PASSWORD: rootpassword
          DB_HOST: 127.0.0.1
          DB_NAME: boutique_telephone_test
        run: |
          pytest test_app.py --cov=app --cov-report=xml --cov-report=html --cov-report=term --disable-warnings || echo "❌ Couverture incomplète"
        continue-on-error: true
      
      # 11. Upload du rapport de couverture
      - name: 📤 Upload du rapport de couverture
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: htmlcov/
          retention-days: 7
        if: always()
      
      # 12. Upload du rapport de tests
      - name: 📤 Upload du rapport de tests
        uses: actions/upload-artifact@v3
        with:
          name: test-report-${{ matrix.python-version }}
          path: |
            test_report.html
            .pytest_cache/
          retention-days: 7
        if: always()
      
      # 13. Notification de succès/échec
      - name: 📢 Notification du statut
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ Tous les tests ont réussi!"
          else
            echo "❌ Des tests ont échoué!"
          fi

  security-scan:
    name: Scan de Sécurité
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v3
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: 📦 Installation des dépendances
        run: |
          pip install bandit safety
      
      - name: 🔒 Scan de sécurité avec Bandit
        run: |
          bandit -r . -f json -o bandit-report.json || true
      
      - name: 🔒 Scan des dépendances avec Safety
        run: |
          safety check --json > safety-report.json || true
      
      - name: 📤 Upload des rapports de sécurité
        uses: actions/upload-artifact@v3
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json
          retention-days: 7
        if: always()

  docker-build:
    name: Build Docker
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    
    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v3
      
      - name: 🐳 Setup Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: 🏗️ Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          tags: |
            boutique-telephone:latest
            boutique-telephone:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: 📤 Upload de l'image Docker
        uses: actions/upload-artifact@v3
        with:
          name: docker-image
          path: /tmp/docker-image.tar
          retention-days: 7
        if: always()

  notification:
    name: Notification
    runs-on: ubuntu-latest
    needs: [test, security-scan, docker-build]
    if: always()
    
    steps:
      - name: 📢 Notification de statut
        run: |
          echo "📊 STATUT DU PIPELINE"
          echo "====================="
          echo "Tests: ${{ needs.test.result }}"
          echo "Sécurité: ${{ needs.security-scan.result }}"
          echo "Docker: ${{ needs.docker-build.result }}"
          
          if [ "${{ needs.test.result }}" == "success" ] && [ "${{ needs.security-scan.result }}" == "success" ]; then
            echo "✅ Pipeline réussi!"
          else
            echo "❌ Pipeline échoué!"
            exit 1
          fi          pytest test_app.py -v --tb=short --maxfail=5 --disable-warnings || echo "❌ Des tests ont échoué"
        env:
          mysql -h127.0.0.1 -uroot -prootpassword -e "SHOW DATABASES;"
          mysql -h127.0.0.1 -uroot -prootpassword -e "CREATE DATABASE IF NOT EXISTS boutique_telephone_test;"
        run: |
          DB_USER: root
          DB_PASSWORD: rootpassword
          DB_PORT: 3306
          DB_HOST: 127.0.0.1
          done
            sleep 2
      - name: ⏳ Attente de MySQL
            echo "⏳ En attente de MySQL... (tentative $i/30)"
            fi
              echo "✅ MySQL est prêt!"
              exit 0
            if mysqladmin ping -h"127.0.0.1" -P"3306" --silent; then
          for i in {1..30}; do
          echo "⏳ Attente de MySQL..."
        run: |
      # 7. Attente de MySQL
      
      - name: 🗄️ Installation de MySQL client

