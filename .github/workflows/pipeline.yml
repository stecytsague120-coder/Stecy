name: CI Pipeline - Boutique de Téléphones

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:  # Permet d'exécuter manuellement

jobs:
  test:
    name: Tests et Validation
    runs-on: ubuntu-latest
    
    # Services nécessaires
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: boutique_telephone_test
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
    
    steps:
      # 1. Checkout du code
      - name: 📥 Checkout du code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      # 2. Installation de Python
      - name: 🐍 Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      # 3. Installation des dépendances
      - name: 📦 Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt
          pip install flake8 black pylint mypy
      
      # 4. Vérification du code avec flake8
      - name: 🔍 Linting avec flake8
        run: |
          flake8 app.py test_app.py --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 app.py test_app.py --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      
      # 5. Formatage avec Black (check)
      - name: ✨ Vérification du formatage avec Black
        run: |
          black --check app.py test_app.py
      
      # 6. Analyse statique avec pylint
      - name: 🔬 Analyse statique avec Pylint
        run: |
          pylint app.py test_app.py --fail-under=7.0 || true
      
      # 7. Installation de MySQL client
      - name: 🗄️ Installation de MySQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client
      
      # 8. Attente de MySQL
      - name: ⏳ Attente de MySQL
        run: |
          while ! mysqladmin ping -h"127.0.0.1" -P"3306" --silent; do
            echo "⏳ En attente de MySQL..."
            sleep 2
          done
          echo "✅ MySQL est prêt!"
      
      # 9. Configuration de la base de données
      - name: 🗄️ Configuration de la base de données
        env:
          DB_USER: root
          DB_PASSWORD: rootpassword
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: boutique_telephone_test
        run: |
          mysql -h127.0.0.1 -uroot -prootpassword -e "CREATE DATABASE IF NOT EXISTS boutique_telephone_test;"
    
    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v3
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: 📦 Installation des dépendances
        run: |
          pip install bandit safety
      
      - name: 🔒 Scan de sécurité avec Bandit
        run: |
          bandit -r . -f json -o bandit-report.json
      
      - name: 🔒 Scan des dépendances avec Safety
        run: |
          safety check --json > safety-report.json || true
      
      - name: 📤 Upload des rapports de sécurité
        uses: actions/upload-artifact@v3
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json
          retention-days: 7

  docker-build:
    name: Build Docker
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    
    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v3
      
      - name: 🐳 Setup Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: 🔑 Login à Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: 🏗️ Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          tags: |
            boutique-telephone:latest
            boutique-telephone:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: 📤 Upload de l'image Docker
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/boutique-telephone:latest
            ${{ secrets.DOCKER_USERNAME }}/boutique-telephone:${{ github.sha }}

  deploy:
    name: Déploiement
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main'
    environment: production
    
    steps:
      - name: 🚀 Déploiement en production
        run: |
          echo "🚀 Déploiement en cours..."
          echo "✅ Déploiement réussi!"
      
      # Exemple de déploiement vers un serveur
      - name: 📦 Déploiement vers le serveur
        if: false  # Désactivé par défaut
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/boutique-telephone:latest
            docker stop boutique-telephone || true
            docker rm boutique-telephone || true
            docker run -d --name boutique-telephone -p 8080:8080 ${{ secrets.DOCKER_USERNAME }}/boutique-telephone:latest

  notification:
    name: Notification
    runs-on: ubuntu-latest
    needs: [test, security-scan, docker-build, deploy]
    if: always()
    
    steps:
      - name: 📢 Notification de statut
        run: |
          echo "📊 STATUT DU PIPELINE"
          echo "====================="
          echo "Tests: ${{ needs.test.result }}"
          echo "Sécurité: ${{ needs.security-scan.result }}"
          echo "Docker: ${{ needs.docker-build.result }}"
          echo "Déploiement: ${{ needs.deploy.result }}"
          
          if [ "${{ needs.test.result }}" == "success" ] && [ "${{ needs.security-scan.result }}" == "success" ]; then
            echo "✅ Pipeline réussi!"
          else
            echo "❌ Pipeline échoué!"
            exit 1
          fi          mysql -h127.0.0.1 -uroot -prootpassword -e "SHOW DATABASES;"
      
      # 10. Exécution des tests avec pytest
      - name: 🧪 Exécution des tests
        env:
          DB_USER: root
          DB_PASSWORD: rootpassword
          DB_HOST: 127.0.0.1
          DB_NAME: boutique_telephone_test
        run: |
    needs: test
            echo "❌ Des tests ont échoué!"
          fi

  security-scan:
    name: Scan de Sécurité
    runs-on: ubuntu-latest
          pytest test_app.py -v --tb=short --maxfail=5
          else
      
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ Tous les tests ont réussi!"
      # 11. Tests avec couverture de code
        if: always()
        run: |
      - name: 📊 Tests avec couverture
        env:
          DB_USER: root
          DB_PASSWORD: rootpassword
          DB_HOST: 127.0.0.1
          DB_NAME: boutique_telephone_test
      # 15. Notification de succès/échec
      - name: 📢 Notification du statut
        run: |
          name: codecov-umbrella
          fail_ci_if_error: false
      
          file: ./coverage.xml
          flags: unittests
          pytest test_app.py --cov=app --cov-report=xml --cov-report=html --cov-report=term
        with:
      
      # 12. Upload du rapport de couverture
        uses: codecov/codecov-action@v3
      - name: 📤 Upload du rapport de couverture
      - name: 📊 Envoi à Codecov
      
      # 13. Upload du rapport de tests
